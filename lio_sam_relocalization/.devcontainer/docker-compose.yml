version: '3'
services:
  lio_sam_relocalization_container:
    build:
      context: .
      dockerfile: Dockerfile
    image: elaina/lio_sam_relocalization
    container_name: lio_sam_relocalization_container
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMP_WAIT_POLICY=passive
      - TERM=xterm-256color
    volumes:
      # - ${XAUTHORITY}:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./../..:/home/Elaina/map
      - /dev:/dev
    network_mode: host
    pid: "host" # 添加 pid 命名空间共享
    ipc: "host" # 添加 ipc 命名空间共享    
    privileged: true
    stdin_open: true
    tty: true
    user: "Elaina"
    runtime: nvidia
    working_dir: "/home/Elaina/map/lio_sam_relocalization" # 指定默认工作目录
