version: '3'
services:
  voxel_service:
    # build:
    #   context: ..
    #   dockerfile: .devcontainer/Dockerfile
    image: elainasuki/rc2025:voxel_slam
    container_name: voxel_slam_container
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMP_WAIT_POLICY=passive
      - TERM=xterm-256color
    volumes:
      # - ${XAUTHORITY}:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      - voxel_slam:/home/Elaina/slam
      - voxel_map:/home/Elaina/map
    network_mode: host
    pid: "host" # 添加 pid 命名空间共享
    ipc: "host" # 添加 ipc 命名空间共享    
    privileged: true
    stdin_open: true
    tty: true
    user: "Elaina"
    # runtime: nvidia
    working_dir: "/home/Elaina/slam/VoxelSlam" # 指定默认工作目录
    entrypoint: [ "/bin/bash", "-i", "-c", "/home/Elaina/slam/docker_start.sh && source ~/.bashrc && roslaunch my_voxel mid360.launch rviz:=false" ]
volumes:
  voxel_slam:
    driver: local
    driver_opts:
      type: none
      device: ./../..
      o: bind
    name: voxel_slam_volume
  voxel_map:
    driver: local
    driver_opts:
      type: none
      device: ./../map
      o: bind
    name: voxel_map_volume
