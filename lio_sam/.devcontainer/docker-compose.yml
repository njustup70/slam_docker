version: '3'
services:
  lio_sam_container:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: yc-dlan/lio_sam
    #runtime: nvidia
    container_name: lio_sam_container
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMP_WAIT_POLICY=passive
      - TERM=xterm-256color
    volumes:
      # - /~/.Xauthority:/tmp/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./..:/home/yc-dlan/packages
      - /dev:/dev
      #地图存放
      # - ../../maps/lio_sam:/home/yc-dlan/packages/ros_ws/src/LIO-SAM-Localization/PCD
    network_mode: host
    pid: "host" # 添加 pid 命名空间共享
    ipc: "host" # 添加 ipc 命名空间共享    
    privileged: true
    stdin_open: true
    tty: true
    user: "yc-dlan"
    working_dir: "/home/yc-dlan/slam_docker/lio_sam/ros_ws" # 指定默认工作目录