version: '3.9'
services:
  visual-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: nagisa/liorf
    container_name: liorf-container
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMP_WAIT_POLICY=passive
      - TERM=xterm-256color
    volumes:
      - ${XAUTHORITY}:/root/.Xauthority
      #可以在windows下使用WSL2的X11服务器但是需要在windows环境目录中添加WSL_X11_SOCKET环境变量
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./../..:/home/Nagisa/packages
    network_mode: host
    pid: "host"
    ipc: "host"
    privileged: true
    stdin_open: true
    tty: true
    user: "Nagisa"
    runtime: "nvidia"
    working_dir: "/home/Nagisa"
    # profiles:
    # - build-required

  builder:
    build:
      context: .
    image: nagisa/liorf
    profiles:
      - build-required
